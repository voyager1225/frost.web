<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>frost.web</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"/>
    <script src="/frost/scripts/quotepicker.js"></script>
    <script src="/frost/scripts/navbuttons.js"></script>
    <style>
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background-color: #121212;
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="container">
        <!-- Header Section -->
        <span class="material-symbols-rounded" style="text-align: center; font-size: 3.5rem; color: var(--md-sys-color-primary)">ac_unit</span>
        <h1 class="md-text-headline" style="font-size: 2.5rem; font-weight: 600; color: var(--md-sys-color-primary)">frost.web</h1>
        
        <!-- Random Quote Card -->
        <div class="md-card">
            <h2 class="md-text-headline"><span class="material-symbols-rounded">format_quote</span> Quote</h2>
            <p class="md-text-body" id="randomquote">if your seeing this, quotepicker.js isnt working :(</p>
        </div>

        <!-- MOTD Box -->
        <div class="md-card" style="background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container);">
            <h2 class="md-text-headline" style="color: var(--md-sys-color-on-primary-container);"><span class="material-symbols-rounded">campaign</span> Message of the Day</h2>
            <p class="md-text-body" style="color: var(--md-sys-color-on-primary-container);">should only show when admin issues announcement, but who cares, it's day 2 of developing frost.web</p>
        </div>
        
        <!-- Nav Square Buttons -->
        <div>
            <h2 class="md-text-headline"><span class="material-symbols-rounded">find_in_page</span> Navigation</h2>
            <div class="nav-grid" id="nav-grid">
            </div>
        </div>
    </div>

    <!-- Particles.js CDN -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
          "particles": {
            "number": {
              "value": 133,
              "density": {
                "enable": true,
                "value_area": 800
              }
            },
            "color": {
              "value": "#246488"
            },
            "shape": {
              "type": "circle",
              "stroke": {
                "width": 0,
                "color": "#000000"
              },
              "polygon": {
                "nb_sides": 5
              },
              "image": {
                "src": "img/github.svg",
                "width": 100,
                "height": 100
              }
            },
            "opacity": {
              "value": 0.5,
              "random": true,
              "anim": {
                "enable": false,
                "speed": 1,
                "opacity_min": 0.1,
                "sync": false
              }
            },
            "size": {
              "value": 10,
              "random": true,
              "anim": {
                "enable": false,
                "speed": 40,
                "size_min": 0.1,
                "sync": false
              }
            },
            "line_linked": {
              "enable": false,
              "distance": 500,
              "color": "#ffffff",
              "opacity": 0.4,
              "width": 2
            },
            "move": {
              "enable": true,
              "speed": 6,
              "direction": "bottom",
              "random": false,
              "straight": false,
              "out_mode": "out",
              "bounce": false,
              "attract": {
                "enable": false,
                "rotateX": 600,
                "rotateY": 1200
              }
            }
          },
          "interactivity": {
            "detect_on": "canvas",
            "events": {
              "onhover": {
                "enable": true,
                "mode": "bubble"
              },
              "onclick": {
                "enable": true,
                "mode": "repulse"
              },
              "resize": true
            },
            "modes": {
              "grab": {
                "distance": 400,
                "line_linked": {
                  "opacity": 0.5
                }
              },
              "bubble": {
                "distance": 400,
                "size": 4,
                "duration": 0.3,
                "opacity": 1,
                "speed": 3
              },
              "repulse": {
                "distance": 200,
                "duration": 0.4
              },
              "push": {
                "particles_nb": 4
              },
              "remove": {
                "particles_nb": 2
              }
            }
          },
          "retina_detect": true
        });
    </script>
</body>
</html>
